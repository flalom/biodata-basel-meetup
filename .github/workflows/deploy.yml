name: Deploy site

# Renders and deploys the community page (index.qmd) via GitHub Pages.
# Other event decks are unaffected: they're already-rendered static HTML
# committed to their own folders and ride along in the artifact untouched.
on:
  push:
    branches: [main]
    paths:
      - index.qmd
      - styles.scss
      - assets/**
      - CNAME
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render index.qmd
        run: quarto render index.qmd
      - name: Drop .git before upload
        run: rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
